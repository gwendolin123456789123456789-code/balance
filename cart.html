<!DOCTYPE html><html class="light" lang="es" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Balance - Mi Carrito</title>

                        "on-tertiary-fixed-variant": "#5a3f4e",

                        "secondary-fixed": "#e2e3e1",

<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            -webkit-font-smoothing: antialiased;
        }
        .wireframe-border {
            border: 1px solid theme('colors.muted-sage');
        }
        .wireframe-border-dark {
            border: 1px solid theme('colors.charcoal-slate');
        }
        .ghost-button {
            border: 1px solid theme('colors.charcoal-slate');
            color: theme('colors.charcoal-slate');
            transition: all 0.3s ease;
        }
        .ghost-button:hover {
            background-color: theme('colors.muted-sage');
            color: theme('colors.linen-cream');
            border-color: theme('colors.muted-sage');
        }
        .input-field {
            border: none;
            border-bottom: 1px solid theme('colors.charcoal-slate');
            background: transparent;
            border-radius: 0;
            padding: 8px 0;
            width: 100%;
        }
        .input-field:focus {
            outline: none;
            border-bottom-color: theme('colors.primary');
            box-shadow: none;
        }
        .radio-custom {
            appearance: none;
            width: 16px;
            height: 16px;
            border: 1px solid theme('colors.charcoal-slate');
            border-radius: 50%;
            outline: none;
            cursor: pointer;
            position: relative;
            margin-right: 8px;
        }
        .radio-custom:checked::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            height: 8px;
            background-color: theme('colors.charcoal-slate');
            border-radius: 50%;
        }
    </style>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="flex flex-col min-h-screen relative overflow-x-hidden pt-16 pb-24 md:pb-0">
<!-- TopAppBar -->
<header class="bg-background/70 backdrop-blur-3xl fixed top-0 w-full z-50 border-b border-muted-sage/20 flex items-center justify-between px-margin-mobile md:px-margin-desktop h-16 max-w-[1280px] mx-auto left-0 right-0">
<div class="flex items-center gap-4">
<a href="index.html" class="text-secondary hover:text-muted-sage transition-colors duration-300 active:opacity-70 flex">
<span class="material-symbols-outlined">arrow_back</span>
</a>
<div class="font-headline-md text-headline-md text-charcoal-slate flex items-center gap-2">
<span class="">Balance</span>
</div>
</div>
<div class="relative">
<button class="text-primary font-headline-md text-headline-md uppercase tracking-widest hover:text-muted-sage transition-colors duration-300 active:opacity-70">
<span class="material-symbols-outlined">shopping_bag</span>
</button>
<span id="cart-badge" class="absolute -top-1 -right-1 flex h-4 w-4 items-center justify-center rounded-full bg-error text-on-error text-[10px] font-bold" style="display:none">0</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center w-full px-margin-mobile md:px-margin-desktop py-8 max-w-3xl mx-auto mt-8">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-charcoal-slate mb-8 w-full text-center">Mi Carrito</h1>
<!-- Cart Items List -->
<section id="cart-items" class="w-full flex flex-col gap-4 mb-section-gap">
<!-- JS renders cart items here -->
</section>

<!-- Resumen Subtotal/Total Mobile friendly -->
<section class="w-full border-t border-muted-sage/30 mb-8 pt-4">
<div class="flex justify-between items-center py-2">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Subtotal</span>
<span id="cart-subtotal" class="font-headline-md text-headline-md text-charcoal-slate">$0</span>
</div>
<div class="flex justify-between items-center py-2">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Envío</span>
<span class="font-body-md text-body-md text-charcoal-slate">A coordinar</span>
</div>
<div class="flex justify-between items-center py-4 mt-2 border-t border-muted-sage/30">
<span class="font-headline-md text-headline-md text-charcoal-slate uppercase tracking-wider">Total</span>
<span id="cart-total" class="font-display-lg text-[32px] text-primary">$0</span>
</div>
</section>

<!-- Checkout Form -->
<section class="w-full mb-8">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary text-center uppercase tracking-widest mb-4">Datos de Compra</h2>
<div class="flex flex-col gap-6 mt-4">
<!-- Name -->
<div class="flex flex-col">
    <label class="font-label-sm text-label-sm text-muted-sage uppercase tracking-widest mb-2" for="name">Nombre Completo</label>
    <input id="name" class="input-field font-body-md text-body-md text-charcoal-slate border-muted-sage/50 focus:border-primary placeholder:text-outline/50" placeholder="Ej. Ana Pérez" type="text">
</div>
<!-- Notes -->
<div class="flex flex-col">
    <label class="font-label-sm text-label-sm text-muted-sage uppercase tracking-widest mb-2" for="notes">Notas Adicionales (Opcional)</label>
    <textarea id="notes" class="input-field font-body-md text-body-md text-charcoal-slate border-muted-sage/50 focus:border-primary placeholder:text-outline/50 resize-none" placeholder="Ej: quiero coordinar envío a domicilio" rows="3"></textarea>
</div>
</div>
</section>
<!-- Action Area -->
<div class="w-full mt-8 mb-12 flex justify-center flex-col items-center gap-2">
<button onclick="checkout()" class="ghost-button font-label-md text-label-md uppercase tracking-wider py-4 px-8 w-full max-w-sm flex items-center justify-center gap-3 bg-charcoal-slate text-linen-cream hover:bg-muted-sage border-none">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">send</span>
                Finalizar Pedido vía WhatsApp
</button>
<p class="font-label-sm text-label-sm text-charcoal-slate text-center mt-2 flex items-center justify-center gap-1 opacity-70">
<span class="material-symbols-outlined text-[14px]">lock</span> Pago seguro y coordinado
</p>
</div>
</main>
<script src="main.js"></script>
</body></html>
